<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Midnight Vow: Book Two by Shivam</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,900;1,400&family=Share+Tech+Mono&display=swap');

        body {
            background-color: #030305;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- BOOT SEQUENCE SCREEN --- */
        #boot-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #030305;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 10%;
            box-sizing: border-box;
        }

        .terminal-line {
            color: #00ffcc;
            font-size: 1.2rem;
            margin-bottom: 10px;
            opacity: 0;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #00ffcc;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* --- MAIN COVER SCREEN --- */
        #main-cover {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease-in-out;
            width: 90%;
            max-width: 500px;
            position: relative;
            z-index: 10;
        }

        .cover-container {
            background-color: #050508;
            border: 1px solid #00ffcc;
            border-radius: 2px; /* Sharp corners for Book 2 */
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1), 0 0 10px rgba(0, 255, 204, 0.2) inset;
            text-align: center;
            position: relative;
        }

        /* High Council Corporate/Tech Aesthetic Image */
        .cover-image {
            width: 100%;
            height: 380px;
            background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1470&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            position: relative;
            filter: grayscale(80%) contrast(120%);
        }

        .cover-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(3, 3, 5, 0) 0%, rgba(3, 3, 5, 1) 100%);
        }

        /* Glitch effect overlay on the image */
        .cover-image::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 255, 204, 0.05);
            mix-blend-mode: overlay;
            z-index: 1;
        }

        .cover-content {
            padding: 0 40px 50px 40px;
            position: relative;
            z-index: 2;
            margin-top: -80px;
        }

        .series-title {
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .book-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.1;
            margin: 0 0 10px 0;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #a0a0aa;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .author-name {
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #4a4a5a;
            margin-bottom: 40px;
        }

        .author-name span {
            color: #ffffff;
        }

        .start-btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: rgba(0, 255, 204, 0.2);
            transition: all 0.3s ease;
        }

        .start-btn:hover::before {
            left: 0;
        }

        .start-btn:hover {
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            background-color: #00ffcc;
            color: #030305;
        }
    </style>
</head>
<body>

    <!-- TERMINAL BOOT SEQUENCE -->
    <div id="boot-screen">
        <div class="terminal-line" id="line1">Establishing connection to Citadel Mainframe...</div>
        <div class="terminal-line" id="line2">Bypassing biometric firewalls...</div>
        <div class="terminal-line" id="line3">Decryption Key: TROJAN_HORSE accepted.</div>
        <div class="terminal-line" id="line4" style="color: #ffffff;">Access Granted. Welcome, Director.<span class="cursor"></span></div>
    </div>

    <!-- MAIN COVER -->
    <div id="main-cover">
        <div class="cover-container">
            <div class="cover-image"></div>
            <div class="cover-content">
                <div class="series-title">Phase Two // The Crescent Chronicles</div>
                <h1 class="book-title">The Midnight Vow</h1>
                <div class="subtitle">The Trojan Horse</div>
                <div class="author-name">Authorized by <span>Shivam</span></div>
                
                <a href="chapter1.html" class="start-btn">Access Files</a>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT FOR BOOT ANIMATION -->
    <script>
        window.onload = function() {
            const line1 = document.getElementById('line1');
            const line2 = document.getElementById('line2');
            const line3 = document.getElementById('line3');
            const line4 = document.getElementById('line4');
            const bootScreen = document.getElementById('boot-screen');
            const mainCover = document.getElementById('main-cover');

            // Sequence the terminal typing effect
            setTimeout(() => { line1.style.opacity = 1; }, 500);
            setTimeout(() => { line2.style.opacity = 1; }, 1500);
            setTimeout(() => { line3.style.opacity = 1; }, 2300);
            setTimeout(() => { line4.style.opacity = 1; }, 3000);

            // Fade out the boot screen and fade in the cover
            setTimeout(() => {
                bootScreen.style.transition = "opacity 0.8s ease";
                bootScreen.style.opacity = 0;
                
                setTimeout(() => {
                    bootScreen.style.display = "none";
                    mainCover.style.visibility = "visible";
                    mainCover.style.opacity = 1;
                }, 800); // wait for boot screen to fade out

            }, 4500); // Time before hiding the terminal completely
        };
    </script>

</body>
</html>
